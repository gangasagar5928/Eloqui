name: eloqui
description: Eloqui - Offline AI English Speaking & IELTS Coach
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  pdf: ^3.11.1
  printing: ^5.13.1
  fl_chart: ^0.68.0
  record: ^5.2.1
  just_audio: ^0.9.39
  permission_handler: ^11.3.1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  ffi: ^2.1.3
  plugin_platform_interface: ^2.1.8
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  dio: ^5.6.0
  go_router: ^14.2.7
  intl: ^0.19.0
  uuid: ^4.4.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  crypto: ^3.0.3
  speech_to_text: ^7.0.0

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/lottie/
